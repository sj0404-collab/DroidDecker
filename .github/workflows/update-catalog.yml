name: Update app catalog

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited, deleted, unpublished]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-app-catalog
  cancel-in-progress: false
  queue: max

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Regenerate fork catalog.json
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          CI_GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: sj0404-collab/DroidDecker
          CI_REPO: sj0404-collab/DroidDecker
        run: |
          set -euo pipefail
          python3 tools/release/update_catalog.py --source-repo "$SOURCE_REPO" --ci-repo "$CI_REPO"
